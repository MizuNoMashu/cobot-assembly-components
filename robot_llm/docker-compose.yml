services:
  robot-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: robot-llm:latest
    container_name: robot-llm
    network_mode: host
    environment:
      FRANKA_ROBOT_IP: ${FRANKA_ROBOT_IP:-172.16.0.2}
    stdin_open: true
    tty: true
    working_dir: /app
    cap_add:
      - NET_ADMIN
    # Per sviluppo locale puoi montare il codice host:
    # volumes:
    #   - ./:/app
    command: ["help"]
